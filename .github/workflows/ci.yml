name: CI — Build, Test, Auto-Merge

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        # Real Postgres for the data-layer integration tests. pgvector is required
        # because the migration history creates vector columns before
        # 20260221000002_drop_embeddings.sql removes them.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nntest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dummy values so the build doesn't fail on missing env vars
      OPENAI_API_KEY: sk-test-dummy-key-for-ci-build
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nntest
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nntest
      HAS_API_SECRETS: ${{ secrets.OPENAI_API_KEY != '' && secrets.UPSTASH_VECTOR_REST_URL != '' }}
      ADMIN_PASSWORD: ci-test-password
      NEXT_PUBLIC_USE_MOCK_DATA: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Apply migrations to the test database
        # Proves the ported db/migrations/*.sql still apply cleanly to real
        # Postgres, and gives the integration tests a schema to run against.
        run: npx --no-install tsx scripts/migrate-neon.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/nntest

      - name: Verify migrations are idempotent
        run: |
          OUTPUT=$(npx --no-install tsx scripts/migrate-neon.ts)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "No pending migrations" || {
            echo "::error::Re-running migrations was not a no-op"; exit 1; }
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/nntest

      - name: Run tests
        run: npm test

      - name: Live API tests against the built server
        # These three suites used to be gated on process.env.CI, so they were
        # skipped in CI and only ran locally against whatever held port 3000 —
        # protecting nothing. They now run for real, but only against a dedicated
        # Neon test database.
        #
        # They cannot run against the Postgres service above: src/lib/db.ts uses
        # Neon's HTTP driver, which only speaks to Neon endpoints. The service
        # container covers the data layer via the executor seam in the
        # integration tests; this step covers the running server, and needs a
        # real Neon URL to do it.
        #
        # Set NEON_TEST_DATABASE_URL (a throwaway branch, NOT production — these
        # tests write rows) to switch this on. Skipped until then.
        if: ${{ env.HAS_API_SECRETS == 'true' && env.HAS_NEON_TEST_DB == 'true' }}
        run: |
          npx --no-install tsx scripts/migrate-neon.ts
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 45); do
            curl -sf http://localhost:3000/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          set +e
          RUN_API_TESTS=1 npx --no-install jest __tests__/api/feedback.test.ts __tests__/api/search.test.ts __tests__/api/chat.test.ts
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
        env:
          HAS_API_SECRETS: ${{ secrets.OPENAI_API_KEY != '' && secrets.UPSTASH_VECTOR_REST_URL != '' }}
          HAS_NEON_TEST_DB: ${{ secrets.NEON_TEST_DATABASE_URL != '' }}
          DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
          ADMIN_PASSWORD: ci-test-password

      - name: Security audit (critical)
        run: npm audit --production --audit-level=critical

      - name: Security audit (high — warning only)
        run: npm audit --production --audit-level=high || echo "::warning::High-severity vulnerabilities found — review npm audit output"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Gate on new CodeQL alerts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prRef = context.payload.pull_request.head.ref;

            // Get alerts on this PR branch
            const branchAlerts = await github.rest.codeScanning.listAlertsForRepo({
              owner,
              repo,
              ref: prRef,
              state: 'open',
              per_page: 100,
            });

            // Get alerts already on main (baseline)
            let mainAlertNumbers = new Set();
            try {
              const mainAlerts = await github.rest.codeScanning.listAlertsForRepo({
                owner,
                repo,
                ref: 'main',
                state: 'open',
                per_page: 100,
              });
              mainAlertNumbers = new Set(mainAlerts.data.map(a => a.number));
            } catch {
              // No alerts on main yet — treat as empty baseline
            }

            // New alerts = on branch but NOT on main
            const newAlerts = branchAlerts.data.filter(a => !mainAlertNumbers.has(a.number));

            if (newAlerts.length > 0) {
              const summary = newAlerts.map(a =>
                `  - #${a.number}: ${a.rule.description} (${a.rule.id}) at ${a.most_recent_instance.location.path}:${a.most_recent_instance.location.start_line}`
              ).join('\n');
              core.setFailed(`❌ This PR introduces ${newAlerts.length} new CodeQL alert(s):\n${summary}\n\nFix these issues before merging.`);
            } else {
              core.info(`✅ No new CodeQL alerts introduced by this PR (${branchAlerts.data.length} existing alerts on branch, ${mainAlertNumbers.size} on main).`);
            }

  secret-scan:
    # This repository is public: a committed credential is exposed the moment it
    # is pushed, and deleting it later does not remove it from history. A
    # Supabase account token sat in scripts/ from 2026-02 to 2026-09 (#113, #153,
    # #175) because nothing here looked for it. Rules live in .gitleaks.toml.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the release page.
      GITLEAKS_TARBALL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history, so the PR's base..head range resolves.
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_TARBALL_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Self-test the custom rules
        # gitleaks' defaults have no Supabase or Postgres-URI rule, so the ones
        # that matter here are custom. A rule that silently stopped matching looks
        # exactly like a clean scan, so prove they fire on every run. Fixtures are
        # generated at runtime so no token-shaped literal is ever committed.
        run: |
          fixtures="$RUNNER_TEMP/gitleaks-fixtures"
          report="$RUNNER_TEMP/gitleaks-self-test.json"
          mkdir -p "$fixtures"
          printf 'const token = "sbp_%s";\n' "$(openssl rand -hex 20)" > "$fixtures/pat.ts"
          printf 'DATABASE_URL=postgres://neondb_owner:npg_%s@ep-fixture-123456.us-east-2.aws.neon.tech/neondb\n' "$(openssl rand -hex 8)" > "$fixtures/neon.env"
          printf 'DATABASE_URL: postgres://postgres:postgres@localhost:5432/nntest\n' > "$fixtures/ci-placeholder.yml"
          printf 'DATABASE_URL=postgres://user:password@ep-xxxx.us-east-2.aws.neon.tech/neondb\n' > "$fixtures/env-example"
          gitleaks dir "$fixtures" --config .gitleaks.toml --no-banner --redact --exit-code 0 \
            --report-format json --report-path "$report"
          for rule in supabase-personal-access-token postgres-uri-with-password; do
            jq -e --arg rule "$rule" 'any(.[]; .RuleID == $rule)' "$report" >/dev/null \
              || { echo "::error::gitleaks rule '$rule' did not fire on its fixture"; exit 1; }
          done
          jq -e 'all(.[]; (.File | test("ci-placeholder|env-example")) | not)' "$report" >/dev/null \
            || { echo "::error::a placeholder DATABASE_URL was flagged — the allowlist regressed"; exit 1; }

      - name: Scan the commits in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --verbose --log-opts="$BASE_SHA..$HEAD_SHA"

  auto-merge:
    needs: [build-and-test, codeql, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    if: success() && github.event.pull_request.base.ref == 'develop'
    steps:
      - name: Auto-merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;

            // Close any stale ci-failure issues for this PR
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open'
            });

            for (const issue of issues.data) {
              // Check if this issue is for this PR (title contains PR number or title)
              if (issue.title.includes(`CI Failure: ${prTitle}`) || issue.body.includes(`#${prNumber}`)) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `✅ CI eventually passed and PR #${prNumber} was merged. Closing this stale failure issue.`
                });
              }
            }

            // Add a success comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '✅ **CI Passed** — Build succeeded. Auto-merging to develop.\n\nVercel will deploy to staging automatically.'
            });

            // Merge the PR via squash
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: 'squash'
            });

      - name: Delete merged branch
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
            } catch (e) {
              console.log(`Branch deletion skipped: ${e.message}`);
            }

  production-gate:
    needs: [build-and-test, codeql, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    if: success() && github.event.pull_request.base.ref == 'main'
    steps:
      - name: Comment on production PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '✅ **CI Passed** — This PR targets **main** (production). Merge manually when ready to deploy to production.\n\nVercel will deploy to needhamnavigator.com after merge.'
            });

  on-failure:
    needs: [build-and-test, codeql, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    if: failure()
    steps:
      - name: Comment on PR with failure details
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prTitle = context.payload.pull_request.title;
            const branch = context.payload.pull_request.head.ref;

            // Comment on the PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `❌ **CI Failed** — This PR did not pass build/test checks.\n\n**Branch:** \`${branch}\`\n**Details:** [View full logs](${runUrl})\n\nTo fix: check out the branch, fix the errors, and push again. CI will re-run automatically.`
            });

            // Create a GitHub Issue so it's trackable
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 CI Failure: ${prTitle}`,
              body: `A pull request failed CI checks and needs attention.\n\n**PR:** #${prNumber} — ${prTitle}\n**Branch:** \`${branch}\`\n**CI Logs:** [View full logs](${runUrl})\n\n**Next steps:**\n1. Open a Claude Code session on this repo\n2. Check out the branch: \`git checkout ${branch}\`\n3. Run \`npm run build\` to see the error\n4. Fix the issue and push — CI will re-run\n\nThis issue will auto-close when the PR is merged or closed.`,
              labels: ['ci-failure']
            });
